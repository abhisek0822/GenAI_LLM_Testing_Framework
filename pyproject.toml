[project]
name = "genai-llm-testing-framework"
version = "0.1.0"
description = "Production-style GenAI, LLM, and RAG quality engineering framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "requests>=2.32.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
eval = [
  "deepeval>=3.0.0",
  "ragas>=0.2.0",
  "datasets>=2.20.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "external_eval: requires DeepEval/RAGAS and evaluator credentials",
  "integration: calls a live configured GenAI API",
  "dataset(path): parameterize a test from a JSON golden dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
