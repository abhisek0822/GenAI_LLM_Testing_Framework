trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"

  - script: |
      python -m pip install --upgrade pip
      pip install -e ".[dev]"
    displayName: Install dependencies

  - script: pytest
    displayName: Run pytest suite

  - script: python scripts/run_evaluation.py datasets/chatbot_cases.json --report reports/ci-evaluation-report.json
    displayName: Run offline quality evaluation
